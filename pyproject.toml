[project]
name = "agentic-rag-system"
version = "0.1.0"
description = "Agentic RAG system with LangGraph that auto-corrects retrieval errors"
requires-python = ">=3.10"
dependencies = [
    "langchain",
    "langchain-openai",
    "langchain-community",
    "langchain-huggingface",     # + HuggingFace embeddings
    "langchain-ollama",          # + Ollama embeddings & chat
    "langchain-groq",            # + Groq chat
    "langchain-google-genai",    # + Gemini chat
    "sentence-transformers",     # required by langchain-huggingface
    "langgraph",
    "python-dotenv",
    "tiktoken",
    "faiss-cpu",
    "beautifulsoup4",
    "streamlit>=1.39",
    "pypdf",
    "ipython>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
